apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-nodes
  labels:
    strimzi.io/cluster: my-cluster # link
spec:
  replicas: 3                
  roles:
    - broker
    - controller
  storage:                  
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        class: local-hostpath # storage name
        deleteClaim: false
  resources:
    requests:
      cpu: "0.5"              
      memory: 1Gi       
    limits:
      cpu: "2"               
      memory: 2Gi            
  # Anti-Affinity
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/name
                    operator: In
                    values:
                      - my-cluster-kafka-nodes # ИСПРАВЛЕНО: имя_кластера-имя_пула для точного матчинга
              topologyKey: "kubernetes.io/hostname"
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 3.9.0             #
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain            
        port: 9092
        type: internal
        tls: false
        # replication
    config:                    
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2



