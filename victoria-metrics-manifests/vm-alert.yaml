apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vm-alert-prod
  namespace: victoria-metrics
spec:
  replicaCount: 1
  datasource:
    url: "http://vmsingle-vm-database:8428" # vm base 
  ruleSelector: {}
  
  resources:
    limits: { cpu: "500m", memory: "512Mi" }
    requests: { cpu: "100m", memory: "256Mi" }
