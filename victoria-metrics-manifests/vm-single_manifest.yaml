apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vm-database
  namespace: victoria-metrics
spec:
  # retention time 1 month
  retentionPeriod: "1"
  
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "50m"
      memory: 500Mi


  storage:
    storageClassName: "local-hostpath" 
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
